# ============================================================================
# rules.yaml — Business rules for the RPA Scheduler bots
# ----------------------------------------------------------------------------
# Single source of truth for every tunable decision the three bots make.
# Changing hospital policy should mean editing this file, never a .xaml.
#
# Consumed as: Data/rules.xlsx (flat key/value sheet, generated by
#              tools/yaml_to_xlsx.py) which UiPath reads with Read Range.
#              YAML is the editable form; xlsx is the runtime form.
#
# Owner:   Department coordinator
# Version: 1.0  (2026-09-14)
# ============================================================================

meta:
  version: "1.0"
  effective_from: "2026-09-14"
  owner: "Department Coordinator"
  hospital_name: "Meridian General Hospital"
  timezone: "Asia/Kolkata"

# ----------------------------------------------------------------------------
# 1. BOOKING WINDOW — what counts as a bookable slot at all
# ----------------------------------------------------------------------------
booking:
  min_booking_lead_hours: 2          # Nothing booked less than 2h out
  max_booking_horizon_days: 30       # Slot table is generated 30 days ahead
  default_search_window_days: 7      # Used when a request gives no date range
  max_search_window_days: 30         # Widest window a clerk may request
  allow_same_day_booking: true
  allow_weekend_booking: false       # Slots exist Mon-Fri only
  max_attempts_per_transaction: 3    # Slot-contention retries before failing

# ----------------------------------------------------------------------------
# 2. PRIORITY — who gets the better slot, and why
# ----------------------------------------------------------------------------
# Evaluated top-down by the Scheduling Bot's DerivePriority(); first match wins.
priority:
  levels:
    URGENT: 1
    HIGH:   2
    NORMAL: 3

  derivation:
    - when: "request.urgency == 'URGENT'"
      assign: URGENT
    - when: "request.urgency == 'HIGH'"
      assign: HIGH
    - when: "patient.is_senior == true"        # age >= senior_age_threshold
      assign: HIGH
    - when: "request.is_follow_up == true"
      assign: HIGH
    - when: "always"
      assign: NORMAL

  senior_age_threshold: 60

  # Only URGENT cases may take an emergency-reserve slot.
  emergency_reserve:
    enabled: true
    slots_per_doctor_per_day: 2      # Last 2 slots of each clinic day
    eligible_priorities: [URGENT]

# ----------------------------------------------------------------------------
# 3. SLOT ALLOCATION — the four-pass search and its scoring weights
# ----------------------------------------------------------------------------
allocation:
  # Passes run in order; the first pass yielding a candidate wins.
  passes:
    - id: 1
      name: "Preferred doctor, preferred time band"
      requires_preferred_doctor: true
      match_time_band: true
    - id: 2
      name: "Preferred doctor, any time"
      requires_preferred_doctor: true
      match_time_band: false
    - id: 3
      name: "Any doctor in department, preferred time band"
      requires_preferred_doctor: false
      match_time_band: true
    - id: 4
      name: "Any doctor, any time (first-fit fallback)"
      requires_preferred_doctor: false
      match_time_band: false

  # Scoring weights used by BestOf(). Higher total score wins.
  # Tie-break order after score: Date ASC, StartTime ASC, SlotId ASC.
  weights:
    weight_earliest: 10.0            # Dominant term — sooner is better
    weight_urgency_boost: 15.0       # Extra pull toward the soonest slot for URGENT
    weight_time_band_match: 25.0     # Honour the requested morning/afternoon
    weight_preferred_doctor: 40.0    # Strongest single preference signal
    weight_load_balance: 12.0        # Spread load across doctors in a department
    weight_contiguity: 5.0           # Avoid fragmenting a doctor's day

  time_bands:
    MORNING:   { from: "09:00", to: "12:59" }
    AFTERNOON: { from: "13:00", to: "17:00" }
    ANY:       { from: "09:00", to: "17:00" }

# ----------------------------------------------------------------------------
# 4. CAPACITY — hard caps the bots must never exceed
# ----------------------------------------------------------------------------
capacity:
  respect_doctor_daily_cap: true     # Doctor.daily_slot_cap
  respect_department_daily_cap: true # Department.max_daily_appointments
  allow_overbooking: false           # Overbooking is a human decision only
  overbooking_requires_approval: true

# ----------------------------------------------------------------------------
# 5. REMINDERS — schedule, channels, consent
# ----------------------------------------------------------------------------
reminders:
  enabled: true

  windows:
    - type: REMINDER_24H
      offset_hours: 24
      tolerance_minutes: 15          # Claims appointments +/- 15 min of target
      skip_if_appointment_within_hours: 2   # Late bookings go straight to 2h
    - type: REMINDER_2H
      offset_hours: 2
      tolerance_minutes: 15

  quiet_hours:
    enabled: true
    send_from: "07:00"
    send_to:   "21:00"
    on_violation: "DEFER"            # DEFER (re-attempt next run) | DROP

  channel:
    # Resolution order per preferred_channel; first available wins.
    SMS:   [SMS, EMAIL]              # Fall back to email if SMS unavailable
    EMAIL: [EMAIL, SMS]
    BOTH:  [SMS, EMAIL]              # Send on every available channel

    require_consent: true            # Never message without consent
    sms_pattern: "^\\+[1-9]\\d{9,14}$"
    honour_unsubscribe: true         # Twilio 21610 flips sms_consent to false

    # URGENT/HIGH 2h reminders ignore preferred_channel and use every channel.
    escalate_on_2h_for_priorities: [URGENT, HIGH]

  retry:
    max_attempts: 3
    backoff_seconds: [0, 5, 15]      # Delay before attempt 1, 2, 3
    retryable_http: [429, 500, 502, 503, 504]
    retryable_provider_codes: []     # Twilio/SendGrid data errors are NOT retried
    on_exhausted: "LOG_AND_RAISE_LOW_CONFLICT"

  sms_max_characters: 160            # Longer = 2 billed segments on Twilio trial

# ----------------------------------------------------------------------------
# 6. CONFLICT RESOLUTION — strategy per type, and the safety rails
# ----------------------------------------------------------------------------
conflicts:
  detection_sweep_minutes: 15

  types:
    DOUBLE_BOOKING:
      severity: HIGH
      auto_resolve: true
      # Who keeps the contested slot, evaluated in order.
      keeper_ranking:
        - "priority ASC"             # URGENT beats HIGH beats NORMAL
        - "is_follow_up DESC"        # Treatment continuity
        - "created_at ASC"           # First come
        - "appointment_id ASC"       # Deterministic tie-break
    DOCTOR_UNAVAILABLE:
      severity: HIGH
      auto_resolve: true
      block_slots_before_rescheduling: true   # Stops booking into the gap
      rebook_order: ["priority ASC", "appointment_datetime ASC"]
    CANCELLATION_CASCADE:
      severity: MEDIUM
      auto_resolve: true
    EXCEL_MISMATCH:
      severity: LOW
      auto_resolve: true
      system_of_record: HMS          # Excel is corrected; HMS is never edited from Excel

  reschedule:
    min_reschedule_notice_hours: 4   # Never move an appointment inside 4h
    reschedule_window_days: 3        # Search +/- 3 days around the original date
    max_reschedules_per_appointment: 2
    prefer_same_doctor: true
    prefer_same_time_band: true
    notify_patient: true             # Mandatory — a silent move is unacceptable

  backfill:
    enable_waitlist_backfill: true
    backfill_horizon_days: 14
    eligible_priorities: [URGENT, HIGH]
    only_move_earlier: true          # Never move a patient later to fill a gap

  # Conditions the bot must hand to a human instead of resolving.
  escalate_when:
    - reason: TOO_CLOSE_TO_RESCHEDULE
      condition: "appointment_datetime < now + min_reschedule_notice_hours"
    - reason: TREATMENT_CYCLE_NEEDS_APPROVAL
      condition: "is_follow_up == true AND previous_appointment_id IS NOT NULL"
    - reason: NO_REPLACEMENT_SLOT
      condition: "no viable slot within reschedule_window_days"
    - reason: ORPHAN_IN_EXCEL
      condition: "excel row has no matching HMS appointment"
    - reason: AMBIGUOUS_PRIORITY
      condition: "reschedule_count >= max_reschedules_per_appointment"
    - reason: URGENT_NEVER_AUTO_MOVED
      condition: "priority == 'URGENT'"

# ----------------------------------------------------------------------------
# 7. SAFETY — invariants no bot may violate
# ----------------------------------------------------------------------------
safety:
  never_delete_records: true         # Escalate instead; deletion is unrecoverable
  never_auto_move_urgent: true
  always_notify_on_change: true
  always_write_audit_row: true
  release_slot_lock_in_finally: true # Crashed transactions must not hold locks
  max_concurrent_reminder_jobs: 1    # Two concurrent runs would double-send

# ----------------------------------------------------------------------------
# 8. EXCEPTION HANDLING — what retries and what does not
# ----------------------------------------------------------------------------
exceptions:
  business_exceptions_retry: false   # The process said no; retrying changes nothing
  system_exceptions_retry: true      # The environment failed; retrying may work
  orchestrator_max_retries: 2
  system_retry_backoff_seconds: [2, 4, 8]

  business_exception_codes:
    - VALIDATION_ERROR
    - NO_SLOT_AVAILABLE
    - SLOT_CONTENTION
    - DAILY_CAP_REACHED
    - DOCTOR_INACTIVE
    - NO_CONSENT
    - INVALID_CONTACT

  system_exception_codes:
    - INTERNAL_ERROR
    - UNAUTHORIZED
    - SELECTOR_NOT_FOUND
    - NETWORK_TIMEOUT
    - EXCEL_FILE_LOCKED

# ----------------------------------------------------------------------------
# 9. SLOT LOCKING — the double-booking guard
# ----------------------------------------------------------------------------
locking:
  lock_ttl_seconds: 120
  recheck_version_before_submit: true
  on_version_mismatch: "RETRY_NEXT_BEST_SLOT"
  db_unique_index_on_slot: true      # Final line of defence, enforced in schema

# ----------------------------------------------------------------------------
# 10. EXCEL MIRROR
# ----------------------------------------------------------------------------
excel:
  file_asset: "Excel_FilePath"
  sheet_name: "Appointments"
  reconciliation_key: "ReferenceNo"
  write_on_booking: true             # Same transaction as the booking
  stamp_synced_at: true
  auto_fix:
    MISSING_IN_EXCEL: true
    STATUS_DRIFT: true
    DATETIME_DRIFT: true
    ORPHAN_IN_EXCEL: false           # Escalate — never auto-delete

# ----------------------------------------------------------------------------
# 11. RUNTIME TOGGLES — safe switches for testing and demos
# ----------------------------------------------------------------------------
runtime:
  dry_run_notifications: true        # TRUE during Phase 4 batch testing
  log_level: "Info"
  write_run_summary: true
  # Orchestrator Assets override every value in this section at runtime.
  asset_overrides:
    - DryRunNotifications
    - MaxRetryAttempts
    - HMS_BaseUrl
